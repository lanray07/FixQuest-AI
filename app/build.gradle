plugins { id 'com.android.application' }
android {
    namespace 'com.fixquest.tv'
    compileSdk 35
    defaultConfig { applicationId 'com.fixquest.tv'; minSdk 22; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'com.fixquest.tv.RemoteFlowTest' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
